service: sahayak-ai-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1  # Mumbai region for India data residency
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  environment:
    DOCUMENTS_BUCKET: ${self:custom.documentsBucket}
    USERS_TABLE: ${self:custom.usersTable}
    DOCUMENTS_TABLE: ${self:custom.documentsTable}
    COMPLIANCE_TABLE: ${self:custom.complianceTable}
    FORMS_TABLE: ${self:custom.formsTable}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    EMAIL_FUNCTION_NAME: ${self:service}-${self:provider.stage}-sendEmail
    SMTP_EMAIL: ${env:SMTP_EMAIL}
    SMTP_PASSWORD: ${env:SMTP_PASSWORD}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${self:custom.documentsBucket}/*"
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.usersTable}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.documentsTable}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.complianceTable}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.formsTable}"
        - Effect: Allow
          Action:
            - textract:DetectDocumentText
            - textract:AnalyzeDocument
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"
        - Effect: Allow
          Action:
            - sns:Publish
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminConfirmSignUp
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminListGroupsForUser
          Resource: "*"

custom:
  documentsBucket: sahayak-ai-documents-${self:provider.stage}
  usersTable: sahayak-ai-users-${self:provider.stage}
  documentsTable: sahayak-ai-documents-${self:provider.stage}
  complianceTable: sahayak-ai-compliance-${self:provider.stage}
  formsTable: sahayak-ai-forms-${self:provider.stage}

functions:
  # Email Service
  sendEmail:
    handler: lambda/email/sendEmail.handler
    environment:
      SMTP_EMAIL: ${env:SMTP_EMAIL}
      SMTP_PASSWORD: ${env:SMTP_PASSWORD}
    events:
      - http:
          path: /email/send
          method: post
          cors: true

  # Authentication Functions
  login:
    handler: lambda/auth/login.handler
    events:
      - http:
          path: /auth/login
          method: post
          cors: true

  register:
    handler: lambda/auth/register.handler
    events:
      - http:
          path: /auth/register
          method: post
          cors: true

  forgotPassword:
    handler: lambda/auth/forgotPassword.handler
    events:
      - http:
          path: /auth/forgot-password
          method: post
          cors: true

  resetPassword:
    handler: lambda/auth/resetPassword.handler
    events:
      - http:
          path: /auth/reset-password
          method: post
          cors: true

  # Document Functions
  uploadDocument:
    handler: lambda/uploadDocument.handler
    events:
      - http:
          path: /documents/upload
          method: post
          cors: true

  processDocument:
    handler: lambda/processDocument.handler
    timeout: 60
    events:
      - s3:
          bucket: ${self:custom.documentsBucket}
          event: s3:ObjectCreated:*
          existing: true

  analyzeDocument:
    handler: lambda/analyzeDocument.handler
    timeout: 60
    events:
      - http:
          path: /documents/{documentId}/analyze
          method: get
          cors: true

  getDocument:
    handler: lambda/getDocument.handler
    events:
      - http:
          path: /documents/{documentId}
          method: get
          cors: true

  createUser:
    handler: lambda/createUser.handler
    events:
      - http:
          path: /users
          method: post
          cors: true

  addCompliance:
    handler: lambda/addCompliance.handler
    events:
      - http:
          path: /compliance
          method: post
          cors: true

  getUpcomingDeadlines:
    handler: lambda/getUpcomingDeadlines.handler
    events:
      - http:
          path: /compliance/upcoming
          method: get
          cors: true

  sendReminders:
    handler: lambda/sendReminders.handler
    events:
      - schedule:
          rate: cron(0 9 * * ? *)  # Run daily at 9 AM IST
          enabled: true

  # Admin Functions
  getAdminStats:
    handler: lambda/admin/getStats.handler
    events:
      - http:
          path: /admin/stats
          method: get
          cors: true

  getAdminUsers:
    handler: lambda/admin/getUsers.handler
    events:
      - http:
          path: /admin/users
          method: get
          cors: true

  getAdminDocuments:
    handler: lambda/admin/getDocuments.handler
    events:
      - http:
          path: /admin/documents
          method: get
          cors: true

  addAdminForm:
    handler: lambda/admin/addForm.handler
    events:
      - http:
          path: /admin/forms
          method: post
          cors: true

  startAdminTraining:
    handler: lambda/admin/startTraining.handler
    events:
      - http:
          path: /admin/train
          method: post
          cors: true

  getAdminForms:
    handler: lambda/admin/getForms.handler
    events:
      - http:
          path: /admin/forms
          method: get
          cors: true

resources:
  Resources:
    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: sahayak-ai-users-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            Required: true
            Mutable: false
          - Name: name
            Required: true
            Mutable: true
          - Name: phone_number
            Required: false
            Mutable: true
          - Name: user_type
            AttributeDataType: String
            Mutable: true
          - Name: language
            AttributeDataType: String
            Mutable: true
          - Name: is_admin
            AttributeDataType: String
            Mutable: true

    # Cognito User Pool Client
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: sahayak-ai-client-${self:provider.stage}
        UserPoolId:
          Ref: CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED

    # Cognito Admin User Group
    CognitoAdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Admins
        Description: Administrator users with full access
        UserPoolId:
          Ref: CognitoUserPool
        Precedence: 0

    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.documentsBucket}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: MoveToGlacierAfter1Year
              Status: Enabled
              Transitions:
                - TransitionInDays: 365
                  StorageClass: GLACIER
            - Id: DeleteTempFilesAfter30Days
              Status: Enabled
              ExpirationInDays: 30
              Prefix: temp/

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.usersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DocumentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.documentsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: documentId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: documentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ComplianceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.complianceTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: complianceId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: dueDate
            AttributeType: S
        KeySchema:
          - AttributeName: complianceId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: dueDate
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    FormsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.formsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: formId
            AttributeType: S
        KeySchema:
          - AttributeName: formId
            KeyType: HASH
